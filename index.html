<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simulasi Jaringan 3D</title>
    <meta name="description" content="Ikuti satu permintaan web dari laptop, lewat switch, router, dan server DNS, sampai server web dan kembali lagi. Kabel bisa dicabut dan dipasang, perangkat bisa dimatikan, dan setiap header paket bisa dibuka." />
    <meta name="theme-color" content="#eef0f3" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const t = localStorage.getItem('netsim-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <a class="skip" href="#panel">Lompat ke panel alur</a>
    <header class="top">
      <div class="brand">
        <h1>Simulasi Jaringan</h1>
        <p>Satu permintaan web, dari laptop sampai server dan kembali</p>
      </div>
      <form class="request" id="request" novalidate>
        <div class="request-row">
          <div class="ctl ctl-source">
            <label for="source">Dari</label>
            <select id="source" aria-describedby="url-error"></select>
          </div>
          <div class="ctl ctl-url">
            <label for="url">Alamat web</label>
            <div class="field">
              <span class="field-prefix" aria-hidden="true">http://</span>
              <input id="url" name="url" value="www.jaringan.test" autocomplete="off" spellcheck="false" list="hosts" aria-describedby="url-error" />
            </div>
          </div>
          <datalist id="hosts">
            <option value="www.jaringan.test"></option>
            <option value="jaringan.test"></option>
            <option value="www.tidakada.test"></option>
          </datalist>
          <button class="btn btn-primary" type="submit" id="send">Kirim permintaan</button>
        </div>
        <p class="field-error" id="url-error" hidden></p>
      </form>
      <div class="top-tools">
        <div class="select-wrap">
          <label for="scenario">Skenario</label>
          <select id="scenario">
            <option value="normal">Normal</option>
            <option value="loss">Paket hilang di jalan</option>
            <option value="router-down">Router mati saat data dikirim</option>
            <option value="bad-domain">Nama domain tidak ada</option>
          </select>
        </div>
        <button class="btn btn-icon" type="button" id="theme" aria-label="Pakai tema gelap">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="i-moon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="i-sun"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        </button>
      </div>
    </header>

    <main class="work">
      <section class="stage-wrap" aria-label="Meja lab 3D">
        <div class="stage" id="stage">
