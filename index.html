<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simulasi Jaringan 3D</title>
    <meta name="description" content="Ikuti satu permintaan web dari laptop, lewat switch, router, dan server DNS, sampai server web dan kembali lagi. Kabel bisa dicabut dan dipasang, perangkat bisa dimatikan, dan setiap header paket bisa dibuka." />
    <meta name="theme-color" content="#eef0f3" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const t = localStorage.getItem('netsim-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <a class="skip" href="#panel">Lompat ke panel alur</a>
    <header class="top">
      <div class="brand">
        <h1>Simulasi Jaringan</h1>
        <p>Satu permintaan web, dari laptop sampai server dan kembali</p>
      </div>
      <form class="request" id="request" novalidate>
        <div class="request-row">
          <div class="ctl ctl-source">
            <label for="source">Dari</label>
            <select id="source" aria-describedby="url-error"></select>
          </div>
          <div class="ctl ctl-url">
            <label for="url">Alamat web</label>
            <div class="field">
              <span class="field-prefix" aria-hidden="true">http://</span>
              <input id="url" name="url" value="www.jaringan.test" autocomplete="off" spellcheck="false" list="hosts" aria-describedby="url-error" />
            </div>
          </div>
